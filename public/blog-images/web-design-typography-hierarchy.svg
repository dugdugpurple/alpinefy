<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Design typography hierarchy</title>
  <desc id="desc">Illustration of typography system and visual hierarchy for corporate websites.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07152B" />
      <stop offset="100%" stop-color="#0A1F3F" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="76%" r="62%">
      <stop offset="0%" stop-color="#46F1C4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#46F1C4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="72" y="72" width="1056" height="486" rx="34" fill="#081D3B" fill-opacity="0.83" stroke="#2A4A71" />
  <text x="150" y="150" fill="#34CFFF" font-size="31" font-family="Arial, Helvetica, sans-serif" letter-spacing="5">DESIGN SYSTEM</text>
  <text x="150" y="248" fill="#EAF3FF" font-size="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Headline</text>
  <text x="150" y="316" fill="#B2C8E3" font-size="36" font-family="Arial, Helvetica, sans-serif">Clear hierarchy. Better readability.</text>
  <g fill="#1A2F4D" stroke="#4D719D" stroke-width="2">
    <rect x="150" y="360" width="286" height="56" rx="10" />
    <rect x="456" y="360" width="206" height="56" rx="10" />
    <rect x="150" y="434" width="512" height="56" rx="10" />
  </g>
  <g fill="#EAF3FF" font-size="24" font-family="Arial, Helvetica, sans-serif">
    <text x="176" y="396">Spacing scale 8px</text>
    <text x="486" y="396">Type rhythm</text>
    <text x="176" y="470">Consistent visual flow across all sections</text>
  </g>
  <g fill="none" stroke="#5AB4F3" stroke-width="6">
    <line x1="830" y1="198" x2="1036" y2="198" />
    <line x1="830" y1="252" x2="986" y2="252" />
    <line x1="830" y1="306" x2="930" y2="306" />
  </g>
</svg>
