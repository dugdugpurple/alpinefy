<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Schema markup for AI and Google search</title>
  <desc id="desc">Illustration for JSON-LD, entities and AI search optimization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06142A" />
      <stop offset="100%" stop-color="#0A1F40" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#46F1C4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#46F1C4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="72" y="72" width="1056" height="486" rx="34" fill="#081D3A" fill-opacity="0.83" stroke="#2B4B72" />
  <text x="150" y="142" fill="#35D0FF" font-size="30" font-family="Arial, Helvetica, sans-serif" letter-spacing="5">AI SEO</text>
  <text x="150" y="222" fill="#EAF3FF" font-size="58" font-family="Arial, Helvetica, sans-serif" font-weight="700">Schema markup in search systems</text>
  <g fill="#132E4E" stroke="#4E749F" stroke-width="2">
    <rect x="150" y="282" width="390" height="210" rx="20" />
    <rect x="572" y="282" width="476" height="210" rx="20" />
  </g>
  <g fill="#BCE7FF" font-size="24" font-family="Courier New, monospace">
    <text x="178" y="328">{"@type": "Organization"}</text>
    <text x="178" y="362">{"name": "Alpinefy"}</text>
    <text x="178" y="396">{"sameAs": ["LinkedIn"]}</text>
    <text x="178" y="430">{"address": "Zilina"}</text>
  </g>
  <g fill="#EAF3FF" font-size="32" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="605" y="346">Google Search</text>
    <text x="605" y="392">AI Search Assistants</text>
  </g>
  <text x="605" y="442" fill="#A8C1DE" font-size="28" font-family="Arial, Helvetica, sans-serif">Consistent entities and trusted context</text>
</svg>
